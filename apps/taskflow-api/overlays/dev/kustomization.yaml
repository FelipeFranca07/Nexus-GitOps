apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow-dev

resources:
  - ../../base

replicas:
  - name: taskflow-api
    count: 1

images:
  - name: ghcr.io/felipefranca07/taskflow-api
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: taskflow-api-config
    patch: |-
      - op: replace
        path: /data/APP_VERSION
        value: dev
