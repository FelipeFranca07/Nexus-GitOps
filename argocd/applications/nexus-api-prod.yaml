apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-api-prod
  namespace: argocd
spec:
  project: nexus
  source:
    repoURL: "https://github.com/FelipeFranca07/Nexus-GitOps.git"
    targetRevision: main
    path: apps/nexus-api/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nexus-prod
  # Produção fica com sync manual: alguém precisa aprovar/clicar "Sync" no
  # ArgoCD para promover uma nova revisão, mesmo que o repo já esteja
  # atualizado. dev e staging sincronizam automaticamente; prod não.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
