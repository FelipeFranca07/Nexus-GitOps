apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-root
  namespace: argocd
spec:
  project: taskflow
  source:
    repoURL: "https://github.com/FelipeFranca07/taskflow-gitops.git"
    targetRevision: main
    path: argocd/applications
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
